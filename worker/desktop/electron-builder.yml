appId: com.megaload.desktop
productName: MegaloadDesktop
# ESM import(runtime/*.mjs) + 동봉 바이너리(7zip-bin) 실행 안정성을 위해 asar 비활성.
asar: false

directories:
  output: dist
  # 아이콘을 쓰려면 build/icon.ico 추가 (없으면 Electron 기본 아이콘 사용)
  buildResources: build

files:
  - main/**
  - renderer/**
  - runtime/**
  - package.json
  - node_modules/**

# 자동 업데이트 피드 — generic 프로바이더 + 고정 태그.
# ⚠️ 모니터 앱과 같은 repo 라 github 프로바이더의 "최신 릴리스" 모호성을 피하려
#    고정 URL 의 latest.yml 만 읽게 한다. 매 릴리스마다 dist/latest.yml + Setup.exe +
#    .blockmap 을 'gpu-worker-update' 릴리스에 덮어쓰기 업로드(build-installer.ps1 이 자동 처리).
#    이 블록이 있으면 electron-builder 가 빌드 시 dist/latest.yml 과 app-update.yml 을 생성한다.
publish:
  provider: generic
  url: https://github.com/lhs0609a-cpu/coupanglanding/releases/download/megaload-desktop-update
  channel: latest

win:
  target:
    - nsis

# ─────────────────────────────────────────────────────────────────────────
# macOS 빌드 (DMG) — **코드서명·공증 없음**(Apple Developer 계정 $99/년 미등록).
#
# 서명이 없으면 사용자가 최초 1회 Gatekeeper 를 수동으로 통과시켜야 한다:
#   실행 → "악성 소프트웨어..." 경고 → [완료] → 시스템 설정 → 개인정보 보호 및 보안
#   → 맨 아래 "확인 없이 열기" → 관리자 암호
# (macOS Sequoia 부터 우클릭→열기 우회가 제거돼 위 경로만 유효하다.)
#
# ⚠️ 기능 범위: 광고 자동화·로그인·연결만 동작한다. 이미지 생성(ComfyUI+SDXL)은 CUDA,
#   텍스트 엔진(ollama)은 Windows 바이너리를 받도록 돼 있어 맥에서는 자동설치가 건너뛰어진다.
#   bootstrap 이 플랫폼을 보고 스스로 빠지므로 앱이 죽지는 않는다.
#
# identity: null 이 없으면 electron-builder 가 키체인에서 서명 인증서를 찾다가 CI 에서 실패한다.
mac:
  target:
    - target: dmg
      arch:
        - arm64   # Apple Silicon (M1~)
        - x64     # Intel Mac
  icon: build/icon.png
  category: public.app-category.business
  artifactName: MegaloadDesktop-${version}-${arch}.${ext}
  identity: null

dmg:
  title: 메가로드 도우미 ${version}

# 원클릭 설치기 (사용자가 더블클릭 → 바로 설치)
nsis:
  # 버전 없는 고정 파일명 → 고정 태그(gpu-worker-update)와 합쳐 다운로드 URL 영구 불변.
  # electron-updater 는 latest.yml 의 path/version 으로 갱신을 판단하므로 파일명 고정과 무관하게 동작.
  # 파일명에 버전 포함 → 받은 파일이 몇 버전인지 한눈에. 예: MegaloadDesktop-Setup-0.2.20.exe
  #   자동업데이트(auto-update.mjs)는 latest.yml 의 path 를 동적으로 읽어 받으므로 무관하게 동작.
  #   ⚠️ 웹 다운로드 URL(worker-download.ts)도 같은 파일명을 가리켜야 함 → 릴리스 시 함께 갱신.
  artifactName: MegaloadDesktop-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  shortcutName: 메가로드 도우미
  # Windows '앱 및 기능'/제거 목록에 버전 노출 → 사용자가 설치된 버전을 한눈에 확인.
  #   (파일명/URL 은 영구 불변 유지 — 404 위험·과거 사고 회피)
  uninstallDisplayName: 메가로드 도우미 ${version}
  createDesktopShortcut: true
  # 설치 직후 자동 실행 ON — 사용자가 일일이 안 켜도 바로 동작. (앱은 OS 시작 자동실행도 등록)
  runAfterFinish: true
  # 설치/업데이트 시작 시 실행 중인 앱을 강제 종료(파일 잠금으로 설치 깨짐 방지). build/installer.nsh 참고.
  include: build/installer.nsh
